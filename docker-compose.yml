# Warblade SR in the browser (README.md, "Docker"): docker compose up -d, then open
# http://localhost:8080. Point the data volume at your own Warblade 1.34 data folder.
services:
  warblade:
    build: .
    image: warblade-sr
    ports:
      - "8080:8080"
    volumes:
      - ./game/data:/data:ro          # your Warblade 1.34 data folder (warblade.pac, music, samples)
      - warblade-saves:/saves         # profiles, saves, settings and high scores
    restart: unless-stopped

volumes:
  warblade-saves:
