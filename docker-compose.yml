# Warblade SR in the browser (README.md, "Docker"): docker compose up -d, then open
# http://localhost:8080. Point the data volume at your own Warblade 1.34 data folder, or
# leave it out and players choose their own. Saves stay in each player's browser.
services:
  warblade:
    build: .
    image: warblade-sr
    ports:
      - "8080:8080"
    volumes:
      - ./game/data:/data:ro          # your Warblade 1.34 data folder (warblade.pac, music, samples)
    environment:
      WARBLADE_TRUSTED_PROXIES: ""    # your reverse proxy's address, if there is one
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
