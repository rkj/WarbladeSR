# Runs the tests (tests/README.md): the game-logic tests on the fake engine, the engine tests on
# a headless SDL (tests/build-deps.sh, cached), and, weekly or on demand (it takes hours), the
# red-green check (tests/mutate.py).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # the red-green check (hours long) runs weekly and on demand

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

      - uses: actions/cache@v4
        with:
          path: build/deps-test
          key: deps-test-${{ runner.os }}-${{ hashFiles('tests/build-deps.sh') }}

      - name: Headless SDL for the engine tests
        run: tests/build-deps.sh

      - name: Build
        run: |
          cmake -S tests -B build/tests -G Ninja -DCMAKE_PREFIX_PATH=$PWD/build/deps-test/prefix
          cmake --build build/tests

      - name: Game-logic tests
        run: build/tests/wbtests -j 4

      - name: Engine tests
        run: build/tests/wbengine -j 4

  red-green:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

      - uses: actions/cache@v4
        with:
          path: build/deps-test
          key: deps-test-${{ runner.os }}-${{ hashFiles('tests/build-deps.sh') }}

      - run: tests/build-deps.sh

      - name: Every mutation is caught
        run: python3 tests/mutate.py -j 4
